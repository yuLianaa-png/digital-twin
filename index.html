<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Twin - Invernadero inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow:hidden; }
        #canvas-container {width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: -1;}
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-slate-800 to-gray-900 text-white font-sans h-screen flex flex-col justify-between p-4 pointer-events-none">
    <div id="canvas-container" class="pointer-events-auto"></div>

    <!-- Panel superior-->
    <header class="bg-gray-900/40 backdrop-blur-md border border-gray-700/50 p-4 rounded-2xl flex justify-between items-center max-w-4xl mx-auto w-full pointer-events-auto shadow-lg mt-2">
        <h1 class="text-xl font-bold text-green-400 tracking-wide">Invernadero IoT</h1>
        <div class="flex gap-4">
            <div class="bg-gray-800/80 border border-gray-600/50 px-4 py-1.5 rounded-lg text-sm shadow-inner">
                Batería: <span id="bat-val" class="font-mono text-green-300 font-bold">100%</span>
            </div>
        </div>
    </header>

    <!-- Panel botones principales-->
    <div class="absolute left-12 md:left-24 top-44 flex flex-col gap-5 pointer-events-auto">
        <button id="btn-water" class="bg-gradient-to-r from-blue-700 to-blue-500 hover:from-blue-600 hover:to-blue-400 w-64 py-3.5 rounded-xl font-bold shadow-[0_0_15px_rgba(59,130,246,0.3)] hover:shadow-[0_0_25px_rgba(59,130,246,0.6)] transition-all active:scale-95 text-left pl-6 text-white border border-blue-500/30 tracking-wide">
            Activar Riego
        </button>
        <button id="btn-fert" class="bg-gradient-to-r from-green-700 to-green-500 hover:from-green-600 hover:to-green-400 w-64 py-3.5 rounded-xl font-bold shadow-[0_0_15px_rgba(34,197,94,0.3)] hover:shadow-[0_0_25px_rgba(34,197,94,0.6)] transition-all active:scale-95 text-left pl-6 text-white border border-green-500/30 tracking-wide">
            Activar Abono
        </button>
        <button id="btn-light" class="bg-gradient-to-r from-yellow-600 to-yellow-500 hover:from-yellow-500 hover:to-yellow-400 w-64 py-3.5 rounded-xl font-bold shadow-[0_0_15px_rgba(234,179,8,0.3)] hover:shadow-[0_0_25px_rgba(234,179,8,0.6)] transition-all active:scale-95 text-left pl-6 text-white border border-yellow-500/30 tracking-wide">
            Prender Luces
        </button>
    </div>

    <!-- Panel telemetría -->
    <div class="absolute right-8 md:right-12 top-24 bg-gray-900/50 p-6 rounded-3xl border border-gray-600/30 w-80 pointer-events-auto shadow-[0_8px_32px_rgba(0,0,0,0.5)] backdrop-blur-md">
        <h2 class="text-lg font-bold text-green-400 mb-5 border-b border-gray-600/50 pb-3 tracking-wide">Telemetría por Zona</h2>
        
        <div class="flex flex-col gap-4">
            <!-- Zona 1 -->
            <div class="bg-gray-800/40 border border-gray-700/50 p-4 rounded-2xl flex flex-col gap-2 hover:bg-gray-800/60 transition-colors shadow-inner">
                <span class="font-bold text-sm text-gray-200">Zona 1 (Noroeste)</span>
                <div class="flex justify-between items-center text-sm">
                    <span>Suelo: <span id="hum-z1" class="text-blue-300 font-mono">65%</span></span>
                    <button id="btn-luz-z1" class="bg-gray-700 hover:bg-yellow-500 text-white text-xs px-3 py-1.5 rounded-lg transition-colors border border-gray-600">Luz</button>
                </div>
                <div class="flex justify-between items-center text-sm border-t border-gray-600/30 pt-2 mt-1">
                    <span>Nutrición: <span id="nut-z1" class="text-green-400 font-mono">40%</span></span>
                </div>
            </div>

            <!-- Zona 2 -->
            <div class="bg-gray-800/40 border border-gray-700/50 p-4 rounded-2xl flex flex-col gap-2 hover:bg-gray-800/60 transition-colors shadow-inner">
                <span class="font-bold text-sm text-gray-200">Zona 2 (Noreste)</span>
                <div class="flex justify-between items-center text-sm">
                    <span>Suelo: <span id="hum-z2" class="text-blue-300 font-mono">100%</span></span>
                    <button id="btn-luz-z2" class="bg-gray-700 hover:bg-yellow-500 text-white text-xs px-3 py-1.5 rounded-lg transition-colors border border-gray-600">Luz</button>
                </div>
                <div class="flex justify-between items-center text-sm border-t border-gray-600/30 pt-2 mt-1">
                    <span>Nutrición: <span id="nut-z2" class="text-green-400 font-mono">45%</span></span>
                </div>
            </div>

            <!-- Zona 3 -->
            <div class="bg-gray-800/40 border border-gray-700/50 p-4 rounded-2xl flex flex-col gap-2 hover:bg-gray-800/60 transition-colors shadow-inner">
                <span class="font-bold text-sm text-gray-200">Zona 3 (Suroeste)</span>
                <div class="flex justify-between items-center text-sm">
                    <span>Suelo: <span id="hum-z3" class="text-blue-300 font-mono">55%</span></span>
                    <button id="btn-luz-z3" class="bg-gray-700 hover:bg-yellow-500 text-white text-xs px-3 py-1.5 rounded-lg transition-colors border border-gray-600">Luz</button>
                </div>
                <div class="flex justify-between items-center text-sm border-t border-gray-600/30 pt-2 mt-1">
                    <span>Nutrición: <span id="nut-z3" class="text-green-400 font-mono">35%</span></span>
                </div>
            </div>

            <!-- Zona 4 -->
            <div class="bg-gray-800/40 border border-gray-700/50 p-4 rounded-2xl flex flex-col gap-2 hover:bg-gray-800/60 transition-colors shadow-inner">
                <span class="font-bold text-sm text-gray-200">Zona 4 (Sureste)</span>
                <div class="flex justify-between items-center text-sm">
                    <span>Suelo: <span id="hum-z4" class="text-blue-300 font-mono">60%</span></span>
                    <button id="btn-luz-z4" class="bg-gray-700 hover:bg-yellow-500 text-white text-xs px-3 py-1.5 rounded-lg transition-colors border border-gray-600">Luz</button>
                </div>
                <div class="flex justify-between items-center text-sm border-t border-gray-600/30 pt-2 mt-1">
                    <span>Nutrición: <span id="nut-z4" class="text-green-400 font-mono">50%</span></span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="main.js"></script>
    <script src="mockAPI.js"></script>
</body>
</html>
